name: Manter Supabase ativo

on:
  schedule:
    # 06:17 no horario de Brasilia (09:17 UTC), todos os dias.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-database:
    name: Consultar banco AllanNet EDU
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: aws-1-sa-east-1.pooler.supabase.com

    steps:
      - name: Conferir configuracao segura
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Cadastre SUPABASE_DB_PASSWORD e SUPABASE_PROJECT_REF nos Secrets do repositorio."
            exit 1
          fi

      - name: Executar consulta SQL no AllanNet EDU
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          result="$(psql \
            "host=$SUPABASE_POOLER_HOST port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_REF sslmode=require connect_timeout=20" \
            --no-password \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --command="select 1;")"

          if [[ "$(echo "$result" | tr -d '[:space:]')" != "1" ]]; then
            echo "::error::O banco respondeu, mas a consulta de verificacao nao retornou o valor esperado."
            exit 1
          fi

          echo "Consulta SQL concluida com sucesso. Banco AllanNet EDU ativo."
