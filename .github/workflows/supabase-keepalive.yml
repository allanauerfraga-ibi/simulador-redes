name: Manter Supabase ativo

on:
  schedule:
    # 06:17 no horario de Brasilia (09:17 UTC), todos os dias.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-database:
    name: Consultar banco AllanNet EDU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: aws-1-sa-east-1.pooler.supabase.com

    steps:
      - name: Conferir configuracao segura
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Cadastre SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD e SUPABASE_PROJECT_REF nos Secrets do repositorio."
            exit 1
          fi

      - name: Garantir que o projeto esteja ativo
        shell: bash
        run: |
          set -euo pipefail
          project_json="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"

          project_status="$(PROJECT_JSON="$project_json" python3 - <<'PY'
          import json
          import os
          print(json.loads(os.environ["PROJECT_JSON"]).get("status", "UNKNOWN"))
          PY
          )"
          echo "Status informado pelo Supabase: $project_status"

          case "$project_status" in
            INACTIVE|PAUSED)
              echo "Projeto pausado. Solicitando retomada segura..."
              restore_code="$(curl \
                --silent \
                --show-error \
                --retry 3 \
                --output /dev/null \
                --write-out "%{http_code}" \
                --request POST \
                --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                --header "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore")"
              if [[ ! "$restore_code" =~ ^20[0-9]$ ]]; then
                echo "::error::O Supabase recusou a retomada automatica (HTTP $restore_code)."
                exit 1
              fi
              echo "Retomada solicitada. Aguardando os servicos iniciarem."
              ;;
            ACTIVE_HEALTHY|ACTIVE_UNHEALTHY|COMING_UP|RESTORING)
              echo "Projeto ativo ou em processo de inicializacao."
              ;;
            *)
              echo "Status ainda nao reconhecido; a rotina tentara conectar com seguranca."
              ;;
          esac

      - name: Executar consulta SQL no AllanNet EDU
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if result="$(psql \
              "host=$SUPABASE_POOLER_HOST port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_REF sslmode=require connect_timeout=20" \
              --no-password \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command="select 1;" 2>/dev/null)"; then
              if [[ "$(echo "$result" | tr -d '[:space:]')" == "1" ]]; then
                echo "Consulta SQL concluida com sucesso. Banco AllanNet EDU ativo."
                exit 0
              fi
            fi

            echo "Banco ainda inicializando: tentativa $attempt de 20."
            sleep 30
          done

          echo "::error::O banco nao ficou disponivel dentro do tempo de espera."
          exit 1
