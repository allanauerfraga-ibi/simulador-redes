name: Manter Supabase ativo

on:
  # Gatilho temporario usado apenas para validar esta correcao.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/supabase-keepalive.yml"
  schedule:
    # 06:17 no horario de Brasilia (09:17 UTC), todos os dias.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-database:
    name: Consultar banco AllanNet EDU
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://puykkgwdaieoleerdrnv.supabase.co
      # Chave publicavel: segura para uso em navegador e codigo publico.
      # Nunca substituir por service_role ou secret key.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_D_2G7v2xmyEFqvpSO5gSrg_KrKDzd41

    steps:
      - name: Fazer consulta autenticada ao PostgREST
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for query_number in 1 2 3; do
            http_code="$(curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 45 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "Accept: application/json" \
              "$SUPABASE_URL/rest/v1/exams?select=id&limit=1")"

            if [[ "$http_code" != "200" ]]; then
              echo "Falha na consulta $query_number ao Supabase (HTTP $http_code)."
              if grep -qi "invalid.*api.*key\|api.*key.*invalid" "$response_file"; then
                echo "Diagnostico: a chave publicavel foi recusada pelo Supabase."
              elif grep -qi "invalid.*jwt\|jwt.*invalid" "$response_file"; then
                echo "Diagnostico: o Supabase tentou validar um JWT invalido."
              elif grep -qi "paused\|suspended" "$response_file"; then
                echo "Diagnostico: o projeto Supabase esta pausado ou suspenso."
              else
                echo "Diagnostico: autenticacao recusada sem categoria conhecida."
              fi
              exit 1
            fi

            if [[ ! -s "$response_file" ]]; then
              echo "O Supabase respondeu sem conteudo na consulta $query_number."
              exit 1
            fi

            echo "Consulta $query_number de 3 concluida (HTTP 200)."
            [[ "$query_number" == "3" ]] || sleep 5
          done
